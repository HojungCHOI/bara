<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#12161f">
<meta name="description" content="예배 중 들리는 찬송과 성경 본문을 마이크로 듣고 자동으로 찾아 주는 도우미">
<title>바라 · 성경 찬송가 헬퍼</title>
<link rel="stylesheet" href="./css/style.css">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="바라">
</head>
<body>

<header class="topbar">
  <h1 class="brand">바라</h1>
  <div class="topbar-actions">
    <button id="btn-settings" class="icon-btn" type="button" aria-label="설정">설정</button>
  </div>
</header>

<main>
  <!-- 듣기 영역 -->
  <section class="listen" aria-label="음성 인식">
    <button id="btn-mic" class="mic" type="button" aria-pressed="false">
      <span class="mic-icon" aria-hidden="true"></span>
      <span class="mic-label">듣기 시작</span>
    </button>
    <p id="status" class="status" role="status" aria-live="polite">
      마이크 버튼을 누르면 들리는 찬송과 성경 본문을 찾아 드립니다.
    </p>
    <p id="transcript" class="transcript" aria-live="off"></p>
  </section>

  <!-- 직접 입력 (마이크가 안 될 때의 대비책) -->
  <section class="manual" aria-label="직접 찾기">
    <form id="form-manual" autocomplete="off">
      <input id="input-manual" type="search" inputmode="search"
             placeholder="예: 요한복음 3장 16절 / 찬송가 305장 / 가사 일부"
             aria-label="직접 찾기">
      <button type="submit" class="btn-primary">찾기</button>
    </form>
  </section>

  <!-- 결과 영역 -->
  <section id="result" class="result" aria-live="polite"></section>

  <!-- 최근 기록 -->
  <section class="history" aria-label="최근 기록">
    <h2 class="section-title">최근</h2>
    <ul id="history-list" class="history-list"></ul>
  </section>
</main>

<!-- 설정 패널 -->
<div id="settings" class="sheet" hidden>
  <div class="sheet-inner" role="dialog" aria-modal="true" aria-label="설정">
    <div class="sheet-head">
      <h2>설정</h2>
      <button id="btn-close-settings" class="icon-btn" type="button" aria-label="닫기">닫기</button>
    </div>

    <div class="setting-row">
      <label for="range-font">글자 크기</label>
      <input id="range-font" type="range" min="0.8" max="2" step="0.1" value="1">
    </div>

    <div class="setting-row">
      <label for="chk-autoopen">인식되면 바로 열기</label>
      <input id="chk-autoopen" type="checkbox" checked>
    </div>

    <div class="setting-row">
      <label for="chk-wakelock">화면 켜 두기</label>
      <input id="chk-wakelock" type="checkbox" checked>
    </div>

    <hr>

    <h3>내 찬송가 불러오기</h3>
    <p class="hint">
      찬송가 번호와 가사는 판본마다 달라서 앱에 미리 넣어 두지 않았습니다.
      본인 교회에서 쓰는 찬송가 목록 파일(JSON 또는 CSV)을 불러오면
      이 기기에만 저장됩니다.
    </p>
    <input id="file-hymns" type="file" accept=".json,.csv,text/csv,application/json">
    <p id="hymn-status" class="hint"></p>
    <p class="hint">
      <a href="./data/hymns.template.csv" download>CSV 서식 내려받기</a> ·
      <a href="./docs/DATA.md">데이터 형식 설명</a>
    </p>

    <hr>

    <h3>성경 본문 불러오기</h3>
    <p class="hint">
      본문 없이도 "요한복음 3장 16절"을 인식해 어디를 펴야 하는지 알려 줍니다.
      본문 파일을 넣으면 구절 내용까지 화면에 보여 줍니다.
    </p>
    <input id="file-bible" type="file" accept=".json,application/json">
    <p id="bible-status" class="hint"></p>

    <hr>
    <button id="btn-clear" class="btn-danger" type="button">저장된 데이터 지우기</button>
  </div>
</div>

<script type="module" src="./js/app.js"></script>
</body>
</html>
